alias: "🗑️ Waste: Collection Verification"
description: >-
  Visual verification of waste bins using AI.

  LOGIC:
  1. Checks the schedule for fractions: Plastic, Paper, Glass, Bio, Mixed.
  2. Dynamically determines the bin color to look for (e.g., "blue or brown").
  3. Updates the camera entity to ensure a fresh image.
  4. Performs image analysis via AI Agent.
  5. Notifies if the bin is missing.

triggers:
  - id: check_pm
    alias: "⏰ Schedule: Evening (21:00)"
    trigger: time
    at: "21:00:00"
  - id: check_am
    alias: "⏰ Schedule: Morning (08:00)"
    trigger: time
    at: "08:00:00"
  - trigger: state
    entity_id:
      - input_button.test_waste_verification
    to: null

conditions:
  - alias: "🔍 Global: Maintenance Check"
    condition: state
    entity_id: input_boolean.maintenance_mode
    state: "off"
  - alias: 📅 Check if collection is Today/Tomorrow
    condition: template
    value_template: |
      {{ 'tomorrow' in states('sensor.next_waste_collection')|lower or 
         'today' in states('sensor.next_waste_collection')|lower }}

actions:
  - alias: 🎨 Determine Bin Colors
    variables:
      target_colors: >
        {% set bins = [] %}
        
        {# --- PLASTIC & METAL (Yellow) --- #}
        {% if 'tomorrow' in states('sensor.waste_plastic')|lower or 'today' in states('sensor.waste_plastic')|lower %}
          {% set bins = bins + ['yellow'] %}
        {% endif %}

        {# --- PAPER (Blue) --- #}
        {% if 'tomorrow' in states('sensor.waste_paper')|lower or 'today' in states('sensor.waste_paper')|lower %}
          {% set bins = bins + ['blue'] %}
        {% endif %}

        {# --- GLASS (Green) --- #}
        {% if 'tomorrow' in states('sensor.waste_glass')|lower or 'today' in states('sensor.waste_glass')|lower %}
          {% set bins = bins + ['green'] %}
        {% endif %}

        {# --- BIO (Brown) --- #}
        {% if 'tomorrow' in states('sensor.waste_bio')|lower or 'today' in states('sensor.waste_bio')|lower %}
          {% set bins = bins + ['brown'] %}
        {% endif %}

        {# --- MIXED (Black) --- #}
        {% if 'tomorrow' in states('sensor.waste_mixed')|lower or 'today' in states('sensor.waste_mixed')|lower %}
          {% set bins = bins + ['black (or grey metal)'] %}
        {% endif %}

        {{ bins | join(' or ') }}

  - alias: 🛑 Stop if no colors found (Sensor Error)
    if:
      - condition: template
        value_template: "{{ target_colors | length == 0 }}"
    then:
      - stop: "No matching waste fractions found despite schedule trigger."

  - alias: 📸 Take Snapshot
    action: camera.snapshot
    target:
      entity_id: camera.driveway_camera
    data:
      filename: /config/www/snapshots/waste_check.jpg

  - delay:
      seconds: 5

  - alias: "🔄 Refresh Camera Entity"
    action: homeassistant.update_entity
    target:
      entity_id: camera.driveway_camera_generic

  - alias: "🧠 AI Analysis (Look for: {{ target_colors }})"
    action: ai_task.generate_data
    data:
      entity_id: ai_task.openai_gpt_5_nano
      task_name: Waste Bin Verification
      instructions: >
        The image shows a driveway. Ignore mailboxes and permanent fixtures.
        Your task is to verify if a trash bin has been placed out for collection.

        Look for a container/bag in color: **{{ target_colors }}**.

        Reply strictly according to this schema:
        - "true" -> if you see a bin in the specified color ({{ target_colors }}).
        - "false" -> if you DO NOT see such a bin.
        - "uncertain" -> if the image is unclear or you are not sure.
      attachments:
        - media_content_id: media-source://camera/camera.driveway_camera_generic
          media_content_type: image/jpeg
    response_variable: result

  - alias: 🔢 Record Result (Counter)
    choose:
      - conditions: "{{ result.data == 'true' }}"
        sequence:
          - action: counter.set_value
            target:
              entity_id: counter.waste_verification_status
            data:
              value: 1
      - conditions: "{{ result.data == 'false' }}"
        sequence:
          - action: counter.set_value
            target:
              entity_id: counter.waste_verification_status
            data:
              value: 2
      - conditions: "{{ result.data == 'uncertain' }}"
        sequence:
          - action: counter.set_value
            target:
              entity_id: counter.waste_verification_status
            data:
              value: 3
    default:
      - action: counter.set_value
        target:
          entity_id: counter.waste_verification_status
        data:
          value: 5

  - alias: "🚨 Notification: BIN MISSING"
    if:
      - condition: state
        entity_id: counter.waste_verification_status
        state: "2"
    then:
      - action: notify.mobile_app_your_phone
        data:
          title: "🗑️ Bins not out!"
          message: "Tomorrow's collection: {{ target_colors }}. AI cannot see the bin!"
          data:
            image: /local/snapshots/waste_check.jpg
            actions:
              - action: "URI"
                title: "Check Cameras"
                uri: "/lovelace/cameras"

mode: single
